<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Medical Plus Badge -->
  <rect x="6" y="8" width="44" height="44" rx="12" fill="url(#medGrad)" filter="url(#shadow)" />
  
  <!-- Stylized Medical Cross (+) -->
  <path d="M28 18 V42 M16 30 H40" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Heart Dot -->
  <circle cx="28" cy="30" r="3" fill="#FFFFFF" />

  <!-- Typography: Doctor Plus -->
  <text x="58" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Doctor</text>
  <text x="133" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#059669" letter-spacing="-0.5">Plus</text>
  
  <!-- Subtitle Tag -->
  <text x="59" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.2">SPECIALIZED HEALTHCARE</text>
</svg>
